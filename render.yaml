services:
  - type: web
    name: studymate-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      # Secrets — set these in the Render dashboard, not here.
      - key: OLLAMA_API_KEY
        sync: false
      - key: HUGGINGFACE_TOKEN
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true

      - key: OLLAMA_BASE_URL
        value: https://ollama.com
      - key: OLLAMA_MODEL
        value: gpt-oss:120b
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: EMBEDDING_DIM
        value: "384"
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: CHUNK_TOKEN_SIZE
        value: "500"
      - key: CHUNK_TOKEN_OVERLAP
        value: "50"
      - key: RETRIEVAL_TOP_K
        value: "8"
      - key: RRF_K
        value: "60"
      - key: QUERY_CACHE_TTL
        value: "3600"
      - key: ANSWER_CACHE_TTL
        value: "3600"

      # Wide open for now (fine — auth is a Bearer token, not cookies).
      # Tighten this to your deployed Netlify origin once it's known, e.g.
      # '["https://your-app.netlify.app"]' — see netlify.toml.
      - key: CORS_ALLOWED_ORIGINS
        value: '["*"]'

      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: studymate-db
          property: connectionString

databases:
  - name: studymate-db
    databaseName: studymate
    plan: free
    region: oregon
